# Server
server.port=9095

# Static asset fingerprinting: Thymeleaf @{...} links render as /css/app-<md5>.css,
# so the 30-day browser cache in production can never serve a stale file — every
# deploy that changes a file also changes its URL. The plain URLs keep working too.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
# Reverse proxy (nginx): trust X-Forwarded-For / X-Forwarded-Proto so the app sees the
# real client IP (login rate-limiting) and scheme (https redirects). Tomcat's RemoteIpValve
# only honors these headers when the direct peer is a private/loopback address, so external
# clients cannot spoof their IP. nginx must send:
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Host $host;
server.forward-headers-strategy=native

# Application
spring.application.name=sarzamin-qesseha

# MySQL DataSource (local/dev). Prefer DB_PASSWORD from the environment; do not reuse
# these defaults in production — prod uses application-prod.properties + compose .env.
spring.datasource.url=jdbc:mysql://localhost:3306/myapp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_persian_ci
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Towz!n8724}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Uploads (voice tales can be long recordings).
# The multipart limits are the hard container ceiling and sit deliberately above the
# app limits below, so a slightly oversized file is rejected by FileStorageService with
# a message that names the real limit instead of a generic container error.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB
# Read and discard the rest of an oversized upload instead of resetting the connection,
# otherwise the browser shows a network error instead of our redirect.
server.tomcat.max-swallow-size=-1
app.upload.dir=uploads
app.upload.max-audio-size=10MB
app.upload.max-image-size=3MB

# Seed data (local/dev only - production overrides these in application-prod.properties)
app.seed.admin-username=admin
app.seed.admin-password=admin123
app.seed.test-admin-username=testadmin
app.seed.test-admin-password=Qesse1234
app.seed.storyteller-password=Qessegoo1234

# Audio streaming tokens: leave blank to generate a random secret per boot
# (set a fixed value if tokens must survive restarts)
app.media.token-secret=

# SMS.ir (override with SMS_API_KEY in production)
app.sms.api-key=${SMS_API_KEY}
app.sms.line-number=3000498352
app.sms.otp-template-id=545384
app.sms.welcome-template-id=221192
app.sms.verify-url=https://api.sms.ir/v1/send/verify
logging.level.com.example.myapp.service.SmsIrClient=INFO
logging.level.com.example.myapp.controller.AuthController=INFO
logging.level.com.example.myapp.controller.SmsLoginController=INFO
